name: CI-CD Pipeline
 
on:

  push:

    branches: [ main ]
 
jobs:

  ci-cd:

    runs-on: self-hosted
 
    steps:

      - name: Checkout Code

        uses: actions/checkout@v4
 
      - name: Build

        run: echo "Build success"
 
      - name: Test

        run: echo "Tests passed"
 
      # Step 4: Deploy using WSL
      - name: Deploy (CD)
        shell: powershell
        run: |
          Write-Host "GitHub Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          $wslPath = wsl wslpath "$env:GITHUB_WORKSPACE"

          Write-Host "WSL Workspace:"
          Write-Host $wslPath

          wsl bash -c "cd '$wslPath' && ls -l && chmod +x app.sh && ./app.sh"
